[project]
name = "routing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Florian Dufour", email = "florian.dufour@setec.com" }
]
requires-python = ">=3.14"
dependencies = [
    "geopandas",
    "numpy",
    "pandas",
    "pydantic>=2",
    "pyogrio",
    "pyproj",
    "scipy",
    "shapely>=2",
    "tzdata",
]

[project.scripts]
routing = "routing:main"
transit-accessibility = "routing.transit_accessibility:main"
transit-accessibility-scenarios = "routing.run_scenarios:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
