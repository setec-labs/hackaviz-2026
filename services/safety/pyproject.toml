[project]
name = "safety"
version = "1.0.0"
description = "API des indicateurs de contexte nocturne de Noctambulle."
readme = "README.md"
authors = [
    { name = "Florian Dufour", email = "florian.dufour@setec.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.3",
    "hackaviz-2026",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
safety = "safety:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
hackaviz-2026 = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
