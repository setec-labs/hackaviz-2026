[project]
name = "hackaviz-2026"
version = "1.0.0"
description = "Noctambulle : cartographier les trajets de nuit en Île-de-France et explorer les liens entre temps de parcours, accessibilité et sentiment de sécurité."
readme = "README.md"
authors = [
    { name = "Florian Dufour", email = "florian.dufour@setec.com" },
    { name = "Victoria Jacob", email = "victoria.jacob@setec.com" },
    { name = "Simon Lavoine", email = "simon.lavoine@setec.com"},
    { name = "Benoit Fontanel", email = "benoit.fontanel@setec.com"}
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2,<3",
]

[project.scripts]
hackaviz-2026 = "hackaviz_2026:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["frontend", "services/routing", "services/safety"]

[dependency-groups]
dev = [
    "zensical>=0.1.1",
]
